<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — XPLabs</title>
<meta name="description" content="That page doesn't exist.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07090A">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
/* =====================================================================
   XPLabs — 404

   Cloudflare Pages serves this file for any URL on xplabs.us that does
   not exist. It renders at arbitrary paths, so every asset reference is
   ABSOLUTE (/logo.png) — a relative path would resolve against whatever
   the visitor typed and break.

   Self-contained: no JavaScript, no external requests. Palette and type
   are the house system from index.html; if the tokens there ever change,
   change these to match.

   TO EDIT TEXT: search for the words you want to change.
   ===================================================================== */
:root {
  --ink:#07090A; --ink-2:#0A0D0E; --surface:#0E1213;
  --line:#1E2527; --line-soft:#161C1D;
  --paper:#E9EFEC;      /* 16.3:1 on --ink */
  --muted:#9BA8A3;      /*  7.9:1 on --ink */
  --muted-dim:#7E8B86;  /*  5.4:1 on --ink — labels only */
  --signal:#3FAC33;     /*  6.8:1 on --ink — sampled from the logo */
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --t-micro:0.6875rem; --t-small:0.8125rem;
  --t-lead: clamp(1.125rem, 1.02rem + 0.42vw, 1.375rem);
  --t-h2:   clamp(2.0625rem, 1.55rem + 2.35vw, 3.375rem);
  --gutter: clamp(1.25rem, 4vw, 3rem); --maxw:1180px;
  --radius:3px; --header-h:60px;
  /* Header and dropdown chrome. These sit in the SHARED nav CSS, which
     tools/sync_nav.py copies to every page, so they are tokens here rather
     than literals there — the one light page (initiatives) sets its own. */
  --header-bg:rgba(7,9,10,.94);
  --panel-shadow:0 14px 34px rgba(0,0,0,.55);
  --on-signal:#04140C;  /* text on a --signal button */
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ink); color:var(--paper);
  font-family:var(--sans); font-size:1.0625rem; line-height:1.62;
  -webkit-font-smoothing:antialiased; overflow-x:clip;
  min-height:100dvh; display:flex; flex-direction:column;
}
img{max-width:100%;height:auto;display:block}
p{margin:0}
a{color:inherit}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter);width:100%}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:2px}

.site-header{background:var(--header-bg);border-bottom:1px solid var(--line-soft)}
.nav{display:flex;align-items:center;min-height:var(--header-h)}
.brand{display:inline-flex;align-items:center;text-decoration:none;flex:none}
.brand__logo{height:21px;width:auto;display:block}

main{flex:1 1 auto;padding-block:clamp(4rem,10vw,8rem)}
.eyebrow{display:flex;align-items:center;gap:.6rem;font-family:var(--mono);font-size:var(--t-micro);letter-spacing:.18em;text-transform:uppercase;color:var(--signal);margin:0 0 1.25rem}
.tick{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.tick i{width:2px;background:var(--signal);border-radius:1px;display:block}
.tick i:nth-child(1){height:35%}.tick i:nth-child(2){height:65%}
.tick i:nth-child(3){height:100%}.tick i:nth-child(4){height:50%}
h1{font-size:var(--t-h2);line-height:1.04;letter-spacing:-.032em;margin:0 0 1.25rem;max-width:19ch;text-wrap:balance}
.lead{font-size:var(--t-lead);color:var(--muted);max-width:60ch;margin:0 0 2rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap;
  font-family:var(--mono);font-size:var(--t-small);letter-spacing:.08em;text-transform:uppercase;
  text-decoration:none;color:var(--on-signal);background:var(--signal);
  padding:.7rem 1.1rem;border-radius:var(--radius);transition:opacity .16s}
.btn:hover{opacity:.86}

.site-footer{border-top:1px solid var(--line-soft);padding-block:2.5rem;color:var(--muted-dim);font-size:var(--t-small)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.001ms!important}
}
</style>
</head>
<body>

<header class="site-header">
  <nav class="wrap nav" aria-label="Primary">
    <a class="brand" href="/">
      <img class="brand__logo" src="/logo.png" alt="XP Labs" width="440" height="107">
    </a>
  </nav>
</header>

<main class="wrap">
  <p class="eyebrow">
    <span class="tick" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    404 · Not found
  </p>
  <h1>That page doesn't exist.</h1>
  <p class="lead">Nothing lives at this address. Everything the company runs is
  indexed from the home page.</p>
  <p><a class="btn" href="/">Back to xplabs.us &rarr;</a></p>
</main>

<footer class="site-footer">
  <div class="wrap">© 2026 XPLabs LLC · Honolulu, HI</div>
</footer>

</body>
</html>
